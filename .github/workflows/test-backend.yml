name: Test - Backend Unit & Security

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Backend Dependencies
        run: |
          cd apps/backend
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install bandit safety pytest openpyxl
        continue-on-error: true

      - name: Run Python SAST Scan (Bandit)
        run: bandit -r apps/backend -ll -x **/__pycache__**,**/tests**
        continue-on-error: true

      - name: Run Pytest Suite
        run: |
          cd apps/backend
          python -m pytest --junitxml=pytest-report.xml || true
        continue-on-error: true

      - name: Upload Backend Test Report Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-report
          path: apps/backend/pytest-report.xml
