name: Test - Frontend Unit & Lint

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Monorepo Dependencies
        run: npm install
        continue-on-error: true

      - name: Lint Frontend
        run: npm run lint -w apps/web --if-present
        continue-on-error: true

      - name: Run Web Unit Tests
        run: npm run test -w apps/web --if-present
        continue-on-error: true

      - name: Create Frontend Test Report Zip Archive
        if: always()
        run: |
          mkdir -p test-reports
          if [ -d apps/web/coverage ]; then
            cp -r apps/web/coverage test-reports/
          fi
          echo "Frontend Unit & Lint execution completed." > test-reports/frontend_test_summary.txt
          (cd test-reports && zip -r frontend_test_report.zip ./*)

      - name: Upload Frontend Test Report Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-test-report
          path: test-reports/
