name: Test - Frontend Unit & Lint

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Monorepo Dependencies
        run: npm install

      - name: Lint Frontend
        run: npm run lint -w apps/web --if-present
        continue-on-error: true

      - name: Run Web Unit Tests
        run: npm run test -w apps/web --if-present
