name: PrivacyShield CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test-frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18
          cache: 'npm'

      - name: Install Monorepo Dependencies
        run: npm install

      - name: Lint Frontend
        run: npm run lint -w apps/web --if-present

      - name: Run Web Unit Tests
        run: npm run test -w apps/web --if-present

  test-backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Backend Dependencies
        run: |
          cd apps/backend
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install bandit safety

      - name: Run Python SAST Scan (Bandit)
        run: |
          bandit -r apps/backend -ll -x **/__pycache__**,**/tests**

      - name: Run Pytest Suite
        run: |
          cd apps/backend
          python -m pytest

  docker-build:
    runs-on: ubuntu-latest
    needs: [test-frontend, test-backend]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Backend
        uses: docker/build-push-action@v4
        with:
          context: ./apps/backend
          push: true
          tags: ghcr.io/${{ github.repository }}/backend:latest

      - name: Build and Push AI Service
        uses: docker/build-push-action@v4
        with:
          context: ./ai-services
          push: true
          tags: ghcr.io/${{ github.repository }}/ai-service:latest
