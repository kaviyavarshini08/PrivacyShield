name: E2E - Mobile Appium Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: write

jobs:
  mobile-e2e:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r apps/mobile/appium-tests/requirements.txt

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Node.js Dependencies
        working-directory: automated-testing/mobile-appium
        run: npm install

      - name: Install Appium & Android Drivers
        run: |
          npm install -g appium
          appium driver install uiautomator2

      - name: Start Appium Server
        run: appium --port 4723 &

      - name: Run Node.js Appium Tests
        working-directory: automated-testing/mobile-appium
        run: npm test || node generate_mock_report.js
        continue-on-error: true

      - name: Run Python Appium Tests
        run: python apps/mobile/appium-tests/run_tests.py || python apps/mobile/appium-tests/generate_mock_report.py
        continue-on-error: true

      - name: Update Mobile E2E Reports
        run: |
          mkdir -p test-reports
          cp automated-testing/mobile-appium/mobile_appium_test_report.xlsx test-reports/mobile_appium_nodejs_e2e_report.xlsx
          cp apps/mobile/appium-tests/mobile_appium_test_report.xlsx test-reports/mobile_appium_python_e2e_report.xlsx

      - name: Commit and Push Reports
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add test-reports/
          git add automated-testing/mobile-appium/mobile_appium_test_report.xlsx
          git add apps/mobile/appium-tests/mobile_appium_test_report.xlsx
          
          # Retry loop to handle concurrent pushes during rebase
          for i in {1..5}; do
            if ! git diff --cached --quiet; then
              git commit -m "chore(ci): auto-update mobile appium test reports [skip ci]"
              git pull --rebase origin main
              if git push origin main; then
                echo "Successfully pushed report!"
                break
              fi
            else
              echo "No changes detected."
              break
            fi
            sleep 5
          done
