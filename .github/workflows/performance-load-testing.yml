name: Performance - Load Testing

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: write

jobs:
  load-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r tests/load-testing/requirements.txt

      - name: Run Performance Load Test
        run: python tests/load-testing/load_test.py --vus 10 --duration 5

      - name: Update Performance Report
        run: |
          mkdir -p test-reports
          cp tests/load-testing/load_test_report.xlsx test-reports/api_load_test_performance_report.xlsx

      - name: Commit and Push Report
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add test-reports/api_load_test_performance_report.xlsx
          git add tests/load-testing/load_test_report.xlsx
          
          # Retry loop to handle concurrent pushes during rebase
          for i in {1..5}; do
            if ! git diff --cached --quiet; then
              git commit -m "chore(ci): auto-update performance load test reports [skip ci]"
              git pull --rebase origin main
              if git push origin main; then
                echo "Successfully pushed report!"
                break
              fi
            else
              echo "No changes detected."
              break
            fi
            sleep 5
          done
