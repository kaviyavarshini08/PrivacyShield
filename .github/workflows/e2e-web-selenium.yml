name: E2E - Web Selenium Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: write

jobs:
  web-e2e:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r automated-testing/web-selenium/requirements.txt

      - name: Run E2E Web Selenium Tests
        run: python automated-testing/web-selenium/run_tests.py

      - name: Update Web E2E Report
        run: |
          mkdir -p test-reports
          cp automated-testing/web-selenium/e2e_test_report.xlsx test-reports/web_selenium_e2e_report.xlsx

      - name: Commit and Push Report
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add test-reports/web_selenium_e2e_report.xlsx
          git add automated-testing/web-selenium/e2e_test_report.xlsx
          
          # Retry loop to handle concurrent pushes during rebase
          for i in {1..5}; do
            if ! git diff --cached --quiet; then
              git commit -m "chore(ci): auto-update web selenium test reports [skip ci]"
              git pull --rebase origin main
              if git push origin main; then
                echo "Successfully pushed report!"
                break
              fi
            else
              echo "No changes detected."
              break
            fi
            sleep 5
          done
