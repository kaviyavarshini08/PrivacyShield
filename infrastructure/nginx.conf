user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log notice;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    keepalive_timeout  65;

    # Rate limiting zone for API endpoints to prevent brute-force attacks
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;

    server {
        listen       80;
        server_name  localhost;

        # Redirect standard HTTP to HTTPS (uncomment in production with SSL certificates)
        # return 301 https://$host$request_uri;

        client_max_body_size 100M; # Support large doc uploads (ZIP, high-res PDF)

        # Route Frontend requests
        location / {
            # In production: proxy_pass to Vite static build files or CDN
            root   /usr/share/nginx/html;
            index  index.html index.htm;
            try_files $uri $uri/ /index.html;
        }

        # Route API gateway requests
        location /api/ {
            proxy_pass http://api:8000/api/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # Apply rate limiting
            limit_req zone=api_limit burst=20 nodelay;
        }

        error_page   500 502 503 504  /50x.html;
        location = /50x.html {
            root   /usr/share/nginx/html;
        }
    }
}
