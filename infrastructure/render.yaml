databases:
  - name: privacyshield-db
    databaseName: privacyshield
    user: dbadmin
    plan: free

services:
  # 2. Redis for caching & Celery broker
  - type: redis
    name: privacyshield-redis
    plan: free
    ipAllowList: [] # Internal-only access

  # 3. AI Service (Python with Tesseract & spaCy)
  - type: web
    name: privacyshield-ai-service
    env: python
    plan: free
    rootDir: ai-services
    buildCommand: pip install --no-cache-dir -r requirements.txt && python -m spacy download en_core_web_sm
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PORT
        value: 8001
      - key: ENABLE_GPU_INFERENCE
        value: "false"

  # 4. FastAPI Backend API Service (Runs API + Celery Worker in background)
  - type: web
    name: privacyshield-backend
    env: python
    plan: free
    rootDir: apps/backend
    buildCommand: pip install --no-cache-dir -r requirements.txt
    startCommand: alembic upgrade head && celery -A app.services.celery worker --loglevel=info & uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: privacyshield-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: privacyshield-redis
          property: connectionString
      - key: AI_SERVICE_URL
        fromService:
          type: web
          name: privacyshield-ai-service
          property: host
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: ENVIRONMENT
        value: production

  # 6. Web Frontend Application (Vite React/TS)
  - type: web
    name: privacyshield-web
    runtime: static
    rootDir: apps/web
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    headers:
      - path: /*
        name: Cache-Control
        value: public, max-age=31536000, immutable
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://privacyshield-backend-awon.onrender.com/api/v1
