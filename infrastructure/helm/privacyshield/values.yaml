# Default values for privacyshield.

global:
  environment: production

replicaCount: 2

image:
  api:
    repository: ghcr.io/company/privacyshield-api
    tag: latest
    pullPolicy: IfNotPresent
  aiService:
    repository: ghcr.io/company/privacyshield-ai-service
    tag: latest
    pullPolicy: IfNotPresent
  worker:
    repository: ghcr.io/company/privacyshield-api
    tag: latest
    pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 8000

ingress:
  enabled: true
  className: nginx
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/proxy-body-size: 100m
  hosts:
    - host: api.privacyshield.company.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: privacyshield-api-tls
      hosts:
        - api.privacyshield.company.com

resources:
  limits:
    cpu: 1000m
    memory: 1024Mi
  requests:
    cpu: 200m
    memory: 256Mi

hpa:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 80
  targetMemoryUtilizationPercentage: 80

env:
  postgresServer: "db-service"
  postgresDb: "privacyshield"
  postgresUser: "postgres"
  redisUrl: "redis://redis-service:6379/0"
  aiServiceUrl: "http://ai-service-service:8001"
  allowedOrigins: "https://privacyshield.company.com"

persistence:
  enabled: true
  storageClass: "gp2"
  size: 20Gi
  mountPath: "/workspace/backend_storage"
