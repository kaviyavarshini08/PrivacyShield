apiVersion: v1
kind: Secret
metadata:
  name: {{ include "privacyshield.fullname" . }}-secrets
type: Opaque
data:
  # Defaults for basic deployment testing, overridden in production via values overrides
  postgres-password: {{ "postgres" | b64enc | quote }}
  jwt-secret-key: {{ "your-super-secret-production-key-change-me" | b64enc | quote }}
