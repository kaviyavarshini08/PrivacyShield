apiVersion: v1
kind: Service
metadata:
  name: {{ include "privacyshield.fullname" . }}-api
  labels:
    app: {{ include "privacyshield.fullname" . }}-api
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: 8000
      protocol: TCP
      name: http
  selector:
    app: {{ include "privacyshield.fullname" . }}-api
